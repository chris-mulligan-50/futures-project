name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    # The team works on Windows; Linux catches anything that only works there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # No DATABENTO_API_KEY is set here, so a test that tries a real
      # download fails instead of quietly spending money.
      - run: python -m pytest
